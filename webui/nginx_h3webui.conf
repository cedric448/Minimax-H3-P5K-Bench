# Minimax-H3 WebUI Nginx 配置(p.md §7)
# 安放: /etc/nginx/conf.d/h3webui.conf
# 鉴权: Basic Auth,用户 admin,密钥 tencentcloud(htpasswd -bc /etc/nginx/.htpasswd admin tencentcloud)
# 安全: 仅限内网/受信网络;公网暴露必须 HTTPS + 安全组白名单

server {
    listen 8080;
    server_name _;

    # 上传首帧图上限(与 SGLang 请求体限制一致)
    client_max_body_size 64m;

    location / {
        auth_basic "Minimax-H3";
        auth_basic_user_file /etc/nginx/.htpasswd;   # htpasswd -bc <file> admin tencentcloud

        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # Gradio WebSocket 必须
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;                     # 视频生成为分钟级,防中途断开
        proxy_send_timeout 3600;
    }
}
